<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Profile Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Our Team</h1>

    <div class="card-container">

        <div class="card">

            <span class="badge">NEW</span>

            <img src="https://via.placeholder.com/120" alt="Profile Picture">

            <div class="card-content">
                <h2>Md. Iftekhar</h2>
                <p>CSE Student</p>
                <p>Interested in Web Development and Programming.</p>
            </div>

        </div>

        <div class="card">

            <span class="badge online">ONLINE</span>

            <img src="https://via.placeholder.com/120" alt="Profile Picture">

            <div class="card-content">
                <h2>Md. Anas</h2>
                <p>CSE Student</p>
                <p>Interested in Software Development and Technology.</p>
            </div>

        </div>

        <div class="card">

            <span class="badge">NEW</span>

            <img src="https://via.placeholder.com/120" alt="Profile Picture">

            <div class="card-content">
                <h2>Saif Uddin</h2>
                <p>CSE Student</p>
                <p>Interested in Programming and Problem Solving.</p>
            </div>

        </div>

    </div>

</body>
</html>
